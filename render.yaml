services:
  - type: web
    name: latiendadecomics
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: latiendadecomics-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: latiendadecomics-db
    databaseName: latiendadecomics
    user: ltcuser
    plan: free
